<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asteroid Quiz Game</title>

  <!-- Orbitron font for sci-fi feel -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

  <!-- Link to game CSS (correct path from html to css folder) -->
  <link rel="stylesheet" href="../css/game.css">
</head>
<body>

  <!-- Game Board Container -->
  <div id="game-board">
    <!-- Exit Button to go back to homepage -->
    <a id="Homebutton" href="index.html">EXIT</a>

    <!-- Stars background layer -->
    <div id="stars-container"></div> 

    <!-- Dynamic Question Area -->
    <div id="question-box">Question: </div>

    <!-- Asteroid and Bullet placeholders -->
    <div id="asteroid"></div>
    <div id="bullet"></div>

    <!-- Spaceship (GIF) -->
    <div id="ship">
      <img src="../images/ship.gif" alt="Spaceship">
    </div>

    <!-- Score Counter -->
    <div id="score">Score: 0</div>
  </div>

  <!-- JavaScript file (correct path from html to js folder) -->
  <script src="../js/game.js"></script>
</body>
</html>
